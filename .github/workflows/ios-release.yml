name: Private IPA build
on:
  workflow_dispatch:
    inputs:
      build_type:
        type: choice
        default: unsigned
        options: [unsigned]
permissions:
  contents: read
jobs:
  build-ios:
    name: Build unsigned IPA on Intel Mac
    runs-on: macos-15-intel
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: stable
          cache: true
      - uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ipa-pub-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: ipa-pub-${{ runner.os }}-${{ runner.arch }}-
      - name: Install dependencies and analyze
        timeout-minutes: 10
        run: |
          flutter pub get
          flutter analyze --no-pub
      - name: Install CocoaPods
        timeout-minutes: 15
        working-directory: ios
        run: pod install --repo-update
      - name: Build archive
        timeout-minutes: 30
        run: flutter build ipa --release --no-codesign
      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          APP="$GITHUB_WORKSPACE/build/ios/archive/Runner.xcarchive/Products/Applications/Runner.app"
          test -d "$APP"
          mkdir -p "$RUNNER_TEMP/rail-pro-package/Payload" "$GITHUB_WORKSPACE/build/ios/ipa"
          cp -R "$APP" "$RUNNER_TEMP/rail-pro-package/Payload/Runner.app"
          cd "$RUNNER_TEMP/rail-pro-package"
          zip -qry "$GITHUB_WORKSPACE/build/ios/ipa/RailPro.ipa" Payload
          unzip -t "$GITHUB_WORKSPACE/build/ios/ipa/RailPro.ipa" | tail -1
      - uses: actions/upload-artifact@v4
        with:
          name: RailPro-iOS-IPA-current
          path: build/ios/ipa/RailPro.ipa
          if-no-files-found: error
          retention-days: 7
