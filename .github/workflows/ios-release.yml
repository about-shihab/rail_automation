name: Standalone iOS IPA Build
on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type (unsigned can be sideloaded with Sideloadly/AltStore, signed requires Apple secrets)'
        required: true
        default: 'unsigned'
        type: choice
        options:
          - unsigned
          - signed
      run_tests:
        description: 'Run unit tests before building (disable to save ~5 minutes)'
        required: false
        default: false
        type: boolean
      upload_archive:
        description: 'Upload full Runner.xcarchive (~1.5GB) with IPA (disable to save ~4 minutes)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: rail-pro-ios-build
  cancel-in-progress: false

jobs:
  build-ios:
    runs-on: macos-15          # Apple Silicon M2, significantly faster than macos-15-intel
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # workmanager_apple 0.9.11 references iOS 26 SDK types.
      # The Intel runner defaults to Xcode 16.4, even with Xcode 26 installed.
      - name: Select Xcode 26.3
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.3'

      - name: Verify iOS SDK
        run: |
          xcodebuild -version
          SDK_VERSION=$(xcrun --sdk iphoneos --show-sdk-version)
          echo "iOS SDK: $SDK_VERSION"
          if [ "${SDK_VERSION%%.*}" -lt 26 ]; then
            echo "::error::workmanager_apple requires the iOS 26 SDK or newer. Select Xcode 26+."
            exit 1
          fi

      - name: Cache Flutter pub packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: flutter-pub-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            flutter-pub-${{ runner.os }}-${{ runner.arch }}-

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: |
            ios/Pods
            ~/Library/Caches/CocoaPods
          key: cocoapods-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('ios/Podfile.lock') }}
          restore-keys: |
            cocoapods-${{ runner.os }}-${{ runner.arch }}-

      - name: Cache Xcode DerivedData
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: xcode-deriveddata-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('ios/Podfile.lock') }}
          restore-keys: |
            xcode-deriveddata-${{ runner.os }}-${{ runner.arch }}-

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run static analysis
        run: flutter analyze --no-pub

      - name: Run unit tests (optional)
        if: ${{ github.event.inputs.run_tests == 'true' }}
        run: flutter test --no-pub

      - name: Setup CocoaPods
        run: |
          cd ios
          pod install
          cd ..

      - name: Setup Apple Codesigning (if secrets provided)
        id: codesign_setup
        env:
          BUILD_TYPE: ${{ github.event.inputs.build_type || 'unsigned' }}
          BUILD_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD || 'temporal-keychain-pass-2026' }}
          CUSTOM_BUNDLE_ID: ${{ secrets.APPLE_BUNDLE_ID }}
        run: |
          if [ "$BUILD_TYPE" = "unsigned" ]; then
            echo "Defaulting to unsigned build (sideloadable via Sideloadly / AltStore)."
            echo "codesign=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          if [ -n "$BUILD_CERTIFICATE_BASE64" ] && [ -n "$BUILD_PROVISION_PROFILE_BASE64" ]; then
            echo "codesign=true" >> $GITHUB_OUTPUT
            CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
            PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
            KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

            echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH
            echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o $PP_PATH

            # Create and unlock temporary keychain
            security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
            security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
            security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

            # Import certificate with codesign partition access
            security import $CERTIFICATE_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
            security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
            security list-keychains -d user -s $KEYCHAIN_PATH $(security list-keychains -d user | tr -d '"')
            security default-keychain -s $KEYCHAIN_PATH

            # Extract metadata from provisioning profile
            PP_PLIST=$RUNNER_TEMP/profile.plist
            security cms -D -i "$PP_PATH" > "$PP_PLIST"
            UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" "$PP_PLIST")
            TEAM_ID=$(/usr/libexec/PlistBuddy -c "Print :TeamIdentifier:0" "$PP_PLIST")
            APP_ID_PREFIX=$(/usr/libexec/PlistBuddy -c "Print :ApplicationIdentifierPrefix:0" "$PP_PLIST" 2>/dev/null || echo "$TEAM_ID")
            APP_ID=$(/usr/libexec/PlistBuddy -c "Print :Entitlements:application-identifier" "$PP_PLIST" 2>/dev/null || echo "")
            DETECTED_BUNDLE_ID=$(echo "$APP_ID" | sed -E "s/^$APP_ID_PREFIX\.//")

            FINAL_BUNDLE_ID="${CUSTOM_BUNDLE_ID:-$DETECTED_BUNDLE_ID}"
            if [ -z "$FINAL_BUNDLE_ID" ] || [ "$FINAL_BUNDLE_ID" = "*" ]; then
              FINAL_BUNDLE_ID="com.example.railAutomation"
            fi

            # Install provisioning profile with its UUID
            mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
            cp "$PP_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/"$UUID".mobileprovision
            echo "Installed profile UUID: $UUID (Team: $TEAM_ID, Bundle ID: $FINAL_BUNDLE_ID)"

            # Detect export method: development, ad-hoc, enterprise, or app-store
            PROVISIONS_ALL=$(/usr/libexec/PlistBuddy -c "Print :ProvisionsAllDevices" "$PP_PLIST" 2>/dev/null || echo "false")
            HAS_DEVICES=$(/usr/libexec/PlistBuddy -c "Print :ProvisionedDevices" "$PP_PLIST" 2>/dev/null || echo "")
            GET_TASK_ALLOW=$(/usr/libexec/PlistBuddy -c "Print :Entitlements:get-task-allow" "$PP_PLIST" 2>/dev/null || echo "false")

            if [ "$PROVISIONS_ALL" = "true" ]; then
              EXPORT_METHOD="enterprise"
            elif [ -n "$HAS_DEVICES" ]; then
              if [ "$GET_TASK_ALLOW" = "true" ]; then
                EXPORT_METHOD="development"
              else
                EXPORT_METHOD="ad-hoc"
              fi
            else
              EXPORT_METHOD="app-store"
            fi
            echo "Detected export method: $EXPORT_METHOD"

            # Sync project bundle ID to match provisioning profile
            if [ "$FINAL_BUNDLE_ID" != "com.example.railAutomation" ]; then
              echo "Updating project bundle identifier to $FINAL_BUNDLE_ID"
              sed -i '' "s/com.example.railAutomation/$FINAL_BUNDLE_ID/g" ios/Runner.xcodeproj/project.pbxproj
            fi

            # Generate dynamic ExportOptions.plist
            printf '%s\n' \
              '<?xml version="1.0" encoding="UTF-8"?>' \
              '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">' \
              '<plist version="1.0">' \
              '<dict>' \
              '    <key>method</key>' \
              "    <string>$EXPORT_METHOD</string>" \
              '    <key>teamID</key>' \
              "    <string>$TEAM_ID</string>" \
              '    <key>signingStyle</key>' \
              '    <string>manual</string>' \
              '    <key>provisioningProfiles</key>' \
              '    <dict>' \
              "        <key>$FINAL_BUNDLE_ID</key>" \
              "        <string>$UUID</string>" \
              '    </dict>' \
              '</dict>' \
              '</plist>' > "$RUNNER_TEMP/ExportOptions.plist"
            echo "export_options=$RUNNER_TEMP/ExportOptions.plist" >> $GITHUB_OUTPUT
          else
            if [ "$BUILD_TYPE" = "signed" ]; then
              echo "::error::Signed build was requested, but APPLE_CERTIFICATE_BASE64 or APPLE_PROVISIONING_PROFILE_BASE64 is missing."
              echo "Please configure the required Apple signing secrets in your GitHub repository secrets."
              exit 1
            fi
            echo "codesign=false" >> $GITHUB_OUTPUT
            echo "No Apple signing secrets provided; proceeding with unsigned IPA."
          fi

      - name: Build iOS Archive
        run: |
          if [ "${{ steps.codesign_setup.outputs.codesign }}" = "true" ]; then
            echo "Building signed iOS IPA using ExportOptions..."
            flutter build ipa --release --export-options-plist="${{ steps.codesign_setup.outputs.export_options }}"
          else
            echo "Building unsigned iOS Archive..."
            flutter build ipa --no-codesign --release
          fi

      - name: Package IPA
        run: |
          OUTPUT_DIR="build/ios/ipa"
          mkdir -p "$OUTPUT_DIR"

          if [ "${{ steps.codesign_setup.outputs.codesign }}" = "true" ]; then
            EXPORTED_IPA=$(find "$OUTPUT_DIR" -maxdepth 1 -name "*.ipa" ! -name "RailPro.ipa" -print -quit)
            if [ -n "$EXPORTED_IPA" ]; then
              echo "Found exported signed IPA at $EXPORTED_IPA"
              cp "$EXPORTED_IPA" "$OUTPUT_DIR/RailPro.ipa"
            elif [ -f "$OUTPUT_DIR/RailPro.ipa" ]; then
              echo "Signed RailPro.ipa already in $OUTPUT_DIR"
            else
              echo "Warning: Exported IPA not in $OUTPUT_DIR; creating fallback package from archive..."
              ARCHIVE_APP="build/ios/archive/Runner.xcarchive/Products/Applications/Runner.app"
              mkdir -p "$OUTPUT_DIR/Payload"
              cp -R "$ARCHIVE_APP" "$OUTPUT_DIR/Payload/"
              cd "$OUTPUT_DIR"
              zip -r -y "RailPro.ipa" "Payload"
              cd - > /dev/null
            fi
            echo "Signed RailPro.ipa successfully prepared for installation."
          else
            ARCHIVE_APP="build/ios/archive/Runner.xcarchive/Products/Applications/Runner.app"
            if [ -d "$ARCHIVE_APP" ]; then
              echo "Packaging unsigned IPA from Runner.app archive..."
              mkdir -p "$OUTPUT_DIR/Payload"
              cp -R "$ARCHIVE_APP" "$OUTPUT_DIR/Payload/"
              cd "$OUTPUT_DIR"
              zip -r -y "RailPro.ipa" "Payload"
              cd - > /dev/null
              echo "Unsigned RailPro.ipa successfully packaged for sideloading!"
            else
              echo "Error: Archive app not found at $ARCHIVE_APP"
              exit 1
            fi
          fi

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RailPro-iOS-IPA
          path: build/ios/ipa/RailPro.ipa

      - name: Upload Full XCArchive Artifact (Optional)
        if: ${{ github.event.inputs.upload_archive == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: RailPro-Runner-XCArchive
          path: build/ios/archive/Runner.xcarchive

      - name: Publish IPA to public distribution repository
        if: success()
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_REPO_TOKEN }}
        run: |
          if [ -n "$GH_TOKEN" ]; then
            python3 scripts/publish_github.py --repo "about-shihab/rail-pro" --upload-ipa-only
          else
            echo "PUBLIC_REPO_TOKEN secret not set; skipping release upload to about-shihab/rail-pro."
          fi

