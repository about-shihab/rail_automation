name: Production release (APK, IPA, website)

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.gitignore'
  workflow_dispatch:
    inputs:
      force_update:
        description: Require all older builds to update after publishing
        type: boolean
        default: true

permissions:
  contents: write   # needed to create the GitHub Release

concurrency:
  group: rail-pro-production-release
  cancel-in-progress: false

env:
  SITE_URL: https://about-shihab.github.io/rail-pro
  PUBLIC_REPO: about-shihab/rail-pro
  FLUTTER_VERSION: '3.47.1'

jobs:
  # ---------------------------------------------------------------
  # 1. Assign the version once. Both builds use the same version/build.
  # ---------------------------------------------------------------
  prepare:
    name: Assign version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
      build: ${{ steps.version.outputs.build }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Assign the next version (automatic force update)
        id: version
        env:
          FORCE: ${{ inputs.force_update != false }}
        run: |
          if [ "$FORCE" = "false" ]; then
            python scripts/release.py prepare --site-url "$SITE_URL" --release-repo "$PUBLIC_REPO" --previous-manifest-url https://railautomation-1993.web.app/update.json
          else
            python scripts/release.py prepare --site-url "$SITE_URL" --release-repo "$PUBLIC_REPO" --previous-manifest-url https://railautomation-1993.web.app/update.json --force
          fi

      # Save every file `prepare` changed or created, explicitly including build/release-plan.json
      - name: Save release state
        run: |
          touch .release-state-marker
          { git ls-files -m -o --exclude-standard; echo build/release-plan.json; echo .release-state-marker; } \
            | grep -v 'release-state.tgz' | sort -u | tr '\n' '\0' | tar --null -T - -czf /tmp/release-state.tgz
          mv /tmp/release-state.tgz ./release-state.tgz

      - uses: actions/upload-artifact@v4
        with:
          name: release-state
          path: release-state.tgz
          retention-days: 7

  # ---------------------------------------------------------------
  # 2a. iOS (runs in parallel with Android)
  # ---------------------------------------------------------------
  build-ios:
    name: Build iOS IPA
    needs: [prepare]
    runs-on: macos-15          # Apple Silicon M2, much faster than macos-15-intel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: release-state

      - name: Apply release state
        run: mv release-state.tgz /tmp/release-state.tgz && tar -xzf /tmp/release-state.tgz && rm -f /tmp/release-state.tgz

      # workmanager_apple 0.9.11 references iOS 26 SDK types.
      - name: Select Xcode 26.3
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.3'

      - name: Verify iOS SDK
        run: |
          xcodebuild -version
          SDK_VERSION=$(xcrun --sdk iphoneos --show-sdk-version)
          echo "iOS SDK: $SDK_VERSION"
          if [ "${SDK_VERSION%%.*}" -lt 26 ]; then
            echo "::error::workmanager_apple requires the iOS 26 SDK or newer. Select Xcode 26+."
            exit 1
          fi

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Cache Flutter pub packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: flutter-pub-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            flutter-pub-${{ runner.os }}-${{ runner.arch }}-

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: |
            ios/Pods
            ~/Library/Caches/CocoaPods
          key: cocoapods-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('ios/Podfile.lock') }}
          restore-keys: |
            cocoapods-${{ runner.os }}-${{ runner.arch }}-

      - name: Cache Xcode DerivedData
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: xcode-deriveddata-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('ios/Podfile.lock') }}
          restore-keys: |
            xcode-deriveddata-${{ runner.os }}-${{ runner.arch }}-

      - name: Install dependencies
        run: flutter pub get

      # `flutter build ios` runs pod install itself without --repo-update
      - name: Build iOS app (no codesign)
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          BUILD: ${{ needs.prepare.outputs.build }}
        run: >
          flutter build ios --release --no-codesign
          --build-name "$VERSION" --build-number "$BUILD"
          --dart-define="UPDATE_MANIFEST_URL=$SITE_URL/update.json"

      - name: Package IPA
        run: |
          APP="build/ios/iphoneos/Runner.app"
          test -d "$APP" || { echo "::error::$APP not found"; exit 1; }
          OUTPUT_DIR="build/ios/ipa"
          mkdir -p "$OUTPUT_DIR/Payload"
          cp -R "$APP" "$OUTPUT_DIR/Payload/"
          (cd "$OUTPUT_DIR" && zip -qr -y RailPro.ipa Payload)

      - uses: actions/upload-artifact@v4
        with:
          name: rail-pro-ios-ipa
          path: build/ios/ipa/RailPro.ipa
          retention-days: 7

  # ---------------------------------------------------------------
  # 2b. Android (runs in parallel with iOS)
  # ---------------------------------------------------------------
  build-android:
    name: Test and build Android APK
    needs: [prepare]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production    # signing secrets
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          name: release-state

      - name: Apply release state
        run: mv release-state.tgz /tmp/release-state.tgz && tar -xzf /tmp/release-state.tgz && rm -f /tmp/release-state.tgz

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle caching
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Cache Flutter pub packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: flutter-pub-${{ runner.os }}-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            flutter-pub-${{ runner.os }}-

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Analyze and test
        run: |
          flutter pub get
          flutter analyze --no-pub
          flutter test --no-pub
          python -m unittest discover -s scripts/tests
          node test/turnstile_bootstrap_test.cjs
          node --test functions/test/*.test.js

      - name: Restore production signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: python scripts/configure_ci_signing.py

      - name: Build the signed APK
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          BUILD: ${{ needs.prepare.outputs.build }}
        run: >
          flutter build apk --release
          --build-name "$VERSION" --build-number "$BUILD"
          --dart-define="UPDATE_MANIFEST_URL=$SITE_URL/update.json"

      - uses: actions/upload-artifact@v4
        with:
          name: rail-pro-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7

  # ---------------------------------------------------------------
  # 3. Bundle the website and publish (waits for both builds)
  # ---------------------------------------------------------------
  publish:
    name: Publish release
    needs: [prepare, build-ios, build-android]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          name: release-state

      - name: Apply release state
        run: mv release-state.tgz /tmp/release-state.tgz && tar -xzf /tmp/release-state.tgz && rm -f /tmp/release-state.tgz

      - uses: actions/download-artifact@v4
        with:
          name: rail-pro-android-apk
          path: build/app/outputs/flutter-apk

      - uses: actions/download-artifact@v4
        with:
          name: rail-pro-ios-ipa
          path: build/ios/ipa

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Bundle the website
        run: python scripts/release.py bundle

      - name: Publish APK, IPA, and website to the public distribution repository
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_REPO_TOKEN }}
        run: |
          test -n "$GH_TOKEN" || { echo "PUBLIC_REPO_TOKEN is required for cross-repository publishing."; exit 1; }
          gh auth setup-git
          python scripts/publish_github.py --repo "$PUBLIC_REPO"

      - uses: actions/upload-artifact@v4
        with:
          name: signed-release-${{ needs.prepare.outputs.version }}
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/ios/ipa/RailPro.ipa
            build/public-site/update.json
