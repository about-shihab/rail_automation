name: Production release (APK, IPA, website)

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.gitignore'
  workflow_dispatch:
    inputs:
      force_update:
        description: Require all older builds to update after publishing
        type: boolean
        default: true

permissions:
  contents: write   # needed to create the GitHub Release

concurrency:
  group: rail-pro-production-release
  cancel-in-progress: false

env:
  SITE_URL: https://about-shihab.github.io/rail-pro
  PUBLIC_REPO: about-shihab/rail-pro

jobs:
  build-ios:
    name: Build iOS IPA
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4

      # workmanager_apple 0.9.11 references iOS 26 SDK types.
      # The Intel runner defaults to Xcode 16.4, even with Xcode 26 installed.
      - name: Select Xcode 26.3
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.3'

      - name: Verify iOS SDK
        run: |
          xcodebuild -version
          SDK_VERSION=$(xcrun --sdk iphoneos --show-sdk-version)
          echo "iOS SDK: $SDK_VERSION"
          if [ "${SDK_VERSION%%.*}" -lt 26 ]; then
            echo "::error::workmanager_apple requires the iOS 26 SDK or newer. Select Xcode 26+."
            exit 1
          fi

      - name: Cache Flutter pub packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: flutter-pub-${{ runner.os }}-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            flutter-pub-${{ runner.os }}-

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: ios/Pods
          key: cocoapods-${{ runner.os }}-${{ hashFiles('ios/Podfile.lock') }}
          restore-keys: |
            cocoapods-${{ runner.os }}-

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Setup CocoaPods
        run: |
          cd ios
          pod install --repo-update
          cd ..

      - name: Build and Package iOS IPA
        run: |
          flutter build ipa --no-codesign --release
          OUTPUT_DIR="build/ios/ipa"
          mkdir -p "$OUTPUT_DIR/Payload"
          ARCHIVE_APP="build/ios/archive/Runner.xcarchive/Products/Applications/Runner.app"
          if [ -d "$ARCHIVE_APP" ]; then
            cp -R "$ARCHIVE_APP" "$OUTPUT_DIR/Payload/"
            cd "$OUTPUT_DIR"
            zip -r -y "RailPro.ipa" "Payload"
            cd - > /dev/null
            echo "Successfully packaged RailPro.ipa"
          else
            echo "Error: Archive app not found"
            exit 1
          fi

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rail-pro-ios-ipa
          path: build/ios/ipa/RailPro.ipa

  publish:
    name: Build Android APK and Publish Release
    needs: [build-ios]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle caching
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Cache Flutter pub packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: flutter-pub-${{ runner.os }}-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            flutter-pub-${{ runner.os }}-

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: stable
          cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Assign the next version (automatic force update)
        id: version
        env:
          FORCE: ${{ inputs.force_update != false }}
        run: |
          if [ "$FORCE" = "false" ]; then
            python scripts/release.py prepare --site-url "$SITE_URL" --release-repo "$PUBLIC_REPO" --previous-manifest-url https://railautomation-1993.web.app/update.json
          else
            python scripts/release.py prepare --site-url "$SITE_URL" --release-repo "$PUBLIC_REPO" --previous-manifest-url https://railautomation-1993.web.app/update.json --force
          fi

      - name: Analyze and test
        run: |
          flutter pub get
          flutter analyze --no-pub
          flutter test --no-pub
          python -m unittest discover -s scripts/tests
          node test/turnstile_bootstrap_test.cjs
          node --test functions/test/*.test.js

      - name: Restore production signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: python scripts/configure_ci_signing.py

      - name: Build the signed APK
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BUILD: ${{ steps.version.outputs.build }}
        run: >
          flutter build apk --release
          --build-name "$VERSION" --build-number "$BUILD"
          --dart-define="UPDATE_MANIFEST_URL=$SITE_URL/update.json"

      - name: Download iOS IPA Artifact
        uses: actions/download-artifact@v4
        with:
          name: rail-pro-ios-ipa
          path: build/ios/ipa

      - name: Bundle the website
        run: python scripts/release.py bundle

      - name: Publish APK, IPA, and website to the public distribution repository
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_REPO_TOKEN }}
        run: |
          test -n "$GH_TOKEN" || { echo "PUBLIC_REPO_TOKEN is required for cross-repository publishing."; exit 1; }
          gh auth setup-git
          python scripts/publish_github.py --repo "$PUBLIC_REPO"

      - uses: actions/upload-artifact@v4
        with:
          name: signed-release-${{ steps.version.outputs.version }}
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/ios/ipa/RailPro.ipa
            build/public-site/update.json
