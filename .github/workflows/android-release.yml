name: Android release and public website
on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - '.gitignore'
  workflow_dispatch:
    inputs:
      force_update:
        description: Require all older builds to update after publishing
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: rail-pro-production-release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: stable
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate public distribution configuration
        env:
          SITE_URL: ${{ vars.PUBLIC_SITE_URL || 'https://railautomation-1993.web.app' }}
          PROJECT: ${{ vars.FIREBASE_PROJECT_ID || 'railautomation-1993' }}
        run: |
          test -n "$SITE_URL"
          test -n "$PROJECT"
      - name: Assign the next version automatically
        id: version
        env:
          SITE_URL: ${{ vars.PUBLIC_SITE_URL || 'https://railautomation-1993.web.app' }}
          FORCE: ${{ github.event.inputs.force_update == true || contains(github.event.head_commit.message, '[force update]') || contains(github.event.head_commit.message, '[force-update]') }}
        run: |
          if [ "$FORCE" = "true" ]; then
            python scripts/release.py prepare --site-url "$SITE_URL" --force
          else
            python scripts/release.py prepare --site-url "$SITE_URL"
          fi
      - run: flutter pub get
      - run: flutter analyze --no-pub
      - run: flutter test --no-pub
      - run: python -m unittest discover -s scripts/tests
      - run: node test/turnstile_bootstrap_test.cjs
      - name: Restore production signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: python scripts/configure_ci_signing.py
      - name: Build the signed APK
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BUILD: ${{ steps.version.outputs.build }}
          SITE_URL: ${{ vars.PUBLIC_SITE_URL || 'https://railautomation-1993.web.app' }}
        run: flutter build apk --release --build-name "$VERSION" --build-number "$BUILD" --dart-define="UPDATE_MANIFEST_URL=$SITE_URL/update.json"
      - run: python scripts/release.py bundle
      - name: Publish website, APK, and update policy together
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ vars.FIREBASE_PROJECT_ID || 'railautomation-1993' }}
          channelId: live
      - uses: actions/upload-artifact@v4
        with:
          name: signed-release-${{ steps.version.outputs.version }}
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/public-site/update.json
