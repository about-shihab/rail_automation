name: Android release and public website

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.gitignore'
  workflow_dispatch:
    inputs:
      force_update:
        description: Require all older builds to update after publishing
        type: boolean
        default: false

permissions:
  contents: write   # needed to create the GitHub Release

concurrency:
  group: rail-pro-production-release
  cancel-in-progress: false

env:
  SITE_URL: https://about-shihab.github.io/rail-pro
  PUBLIC_REPO: about-shihab/rail-pro

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle caching
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Cache Flutter pub packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: flutter-pub-${{ runner.os }}-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            flutter-pub-${{ runner.os }}-

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: stable
          cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Assign the next version
        id: version
        env:
          FORCE: ${{ inputs.force_update == true || contains(github.event.head_commit.message, '[force update]') || contains(github.event.head_commit.message, '[force-update]') }}
        run: |
          if [ "$FORCE" = "true" ]; then
            python scripts/release.py prepare --site-url "$SITE_URL" --release-repo "$PUBLIC_REPO" --previous-manifest-url https://railautomation-1993.web.app/update.json --force
          else
            python scripts/release.py prepare --site-url "$SITE_URL" --release-repo "$PUBLIC_REPO" --previous-manifest-url https://railautomation-1993.web.app/update.json
          fi

      - name: Analyze and test
        run: |
          flutter pub get
          flutter analyze --no-pub
          flutter test --no-pub
          python -m unittest discover -s scripts/tests
          node test/turnstile_bootstrap_test.cjs

      - name: Restore production signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: python scripts/configure_ci_signing.py

      - name: Build the signed APK
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BUILD: ${{ steps.version.outputs.build }}
        run: >
          flutter build apk --release
          --build-name "$VERSION" --build-number "$BUILD"
          --dart-define="UPDATE_MANIFEST_URL=$SITE_URL/update.json"

      - name: Bundle the website
        run: python scripts/release.py bundle

      - name: Publish APK and website to the public distribution repository
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_REPO_TOKEN }}
        run: |
          test -n "$GH_TOKEN" || { echo "PUBLIC_REPO_TOKEN is required for cross-repository publishing."; exit 1; }
          gh auth setup-git
          python scripts/publish_github.py --repo "$PUBLIC_REPO"

      - uses: actions/upload-artifact@v4
        with:
          name: signed-release-${{ steps.version.outputs.version }}
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/public-site/update.json
