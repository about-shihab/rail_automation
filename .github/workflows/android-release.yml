name: Android release and public website

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.gitignore'
  workflow_dispatch:
    inputs:
      force_update:
        description: Require all older builds to update after publishing
        type: boolean
        default: false

permissions:
  contents: write   # needed to create the GitHub Release

concurrency:
  group: rail-pro-production-release
  cancel-in-progress: false

env:
  SITE_URL: ${{ vars.PUBLIC_SITE_URL || 'https://railautomation-1993.web.app' }}
  FIREBASE_PROJECT: ${{ vars.FIREBASE_PROJECT_ID || 'railautomation-1993' }}
  APK_URL: https://github.com/${{ github.repository }}/releases/latest/download/Rail-Pro.apk

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: stable
          cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Assign the next version
        id: version
        env:
          FORCE: ${{ github.event.inputs.force_update == true || contains(github.event.head_commit.message, '[force update]') || contains(github.event.head_commit.message, '[force-update]') }}
        run: |
          if [ "$FORCE" = "true" ]; then
            python scripts/release.py prepare --site-url "$SITE_URL" --force
          else
            python scripts/release.py prepare --site-url "$SITE_URL"
          fi

      - name: Analyze and test
        run: |
          flutter pub get
          flutter analyze --no-pub
          flutter test --no-pub
          python -m unittest discover -s scripts/tests
          node test/turnstile_bootstrap_test.cjs

      - name: Restore production signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: python scripts/configure_ci_signing.py

      - name: Build the signed APK
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BUILD: ${{ steps.version.outputs.build }}
        run: >
          flutter build apk --release
          --build-name "$VERSION" --build-number "$BUILD"
          --dart-define="UPDATE_MANIFEST_URL=$SITE_URL/update.json"

      - name: Bundle the website
        run: python scripts/release.py bundle

      - name: Publish the APK to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk Rail-Pro.apk
          gh release create "v$VERSION" Rail-Pro.apk \
            --target "$GITHUB_SHA" --title "Rail Pro $VERSION" --generate-notes

      - name: Remove the APK from the site and point links at the release
        run: |
          rm -f build/public-site/downloads/*.apk
          sed -i "s#$SITE_URL/downloads/Rail-Pro.apk#$APK_URL#g; s#/downloads/Rail-Pro.apk#$APK_URL#g" \
            build/public-site/index.html build/public-site/update.json

      - name: Deploy the website to Firebase
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ env.FIREBASE_PROJECT }}
          channelId: live
